<!DOCTYPE html>
<html lang="en">

<head>
    
    <title>Job Application Form</title>
</head>

<body>

    <h1>Job Application Form</h1>

    <form>

        <!-- Personal Information -->
        <h2>Personal Information</h2>

        <table border="1" cellpadding="8">
            <tr>
                <th rowspan="2">Personal Details</th>
                <td>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </td>
                <td>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </td>
                 <td>
                    <label for="Address">Address:</label>
                    <input type="Address" id="Address" name="Address">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="mobile">Mobile Number:</label>
                    <input type="tel" id="mobile" name="mobile">
                </td>
                <td>
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                </td>
                <td>
                    <label for="city">City:</label>
                    <input type="city" id="City" name="City">
                </td>
            </tr>

            <tr>
                <th>Gender</th>
                <td colspan="2">
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </td>
            </tr>
        </table>


        <!-- Education Details -->
        <h2>Education Details</h2>

        <table border="1" cellpadding="8">
            <tr>
                <th>Degree</th>
                <th>College Name</th>
                <th>Passing Year</th>
            </tr>

            <tr>
                <td>
                    <select name="degree">
                        <option value="">Select Degree</option>
                        <option value="BBA">BBA</option>
                        <option value="BCA">BCA</option>
                        <option value="BTech">B.Tech</option>
                        <option value="Other">Other</option>
                    </select>
                </td>

                <td>
                    <input type="text" name="college">
                </td>

                <td>
                    <select name="passing_year">
                        <option value="">Select Year</option>
                        <option>2023</option>
                        <option>2024</option>
                        <option>2025</option>
                        <option>2026</option>
                    </select>
                </td>
            </tr>
        </table>


        <!-- Skills -->
        <h2>Skills</h2>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="Frontend Development" name="skills" value="Frontend Development">
        <label for="Frontend Development">Frontend Development</label><br>

        <input type="checkbox" id="Backend Development" name="skills" value="Backend Development">
        <label for="Backend Development">Backend Development</label><br>

        <input type="checkbox" id="Full stack Development" name="skills" value="Full stack Development">
        <label for="Full stack Development">Full stack Development</label><br>


        <!-- Resume Upload -->
        <h2>Resume Upload</h2>

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume">


        <!-- Buttons -->
        <h2>Buttons</h2>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
