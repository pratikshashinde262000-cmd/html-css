<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile Card</title>

    <style>
        body {
            background-color: #f2f2f2;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .profile-card {
            width: 300px;
            border: 2px solid black;
            padding: 20px;
            margin: 50px auto;
            text-align: center;
            background-color: white;
            display: inline-block;
        }

        .profile-card img {
            width: 120px;
            height: 120px;
            border: 2px solid black;
            margin-bottom: 10px;
        }

        .profile-card h2 {
            font-size: 24px;
            font-family: Georgia, serif;
            margin: 10px;
        }

        .profile-card p {
            font-size: 16px;
            margin: 8px;
        }

        .email {
            text-decoration: underline;
            font-size: 15px;
        }

        .contact-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border: 1px solid black;
            font-size: 16px;
        }

        .contact-btn:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <!-- Student Image -->
        <img src="../Day-8.CSS/WhatsApp Image 2026-08-09 at 11.20.00 PM.jpeg" alt="Student Image">

        <!-- Student Name -->
        <h2>Pratiksha Shinde</h2>

        <!-- Course Name -->
        <p><strong>Course:</strong> Full Stack Development</p>

        <!-- Email -->
        <p class="email">pratikshashinde262000@gmail.com</p>

        <!-- Contact Button -->
        <a href="mailto:pratiksha@example.com" class="contact-btn">
            Contact Me
        </a>

    </div>

</body>
</html>
