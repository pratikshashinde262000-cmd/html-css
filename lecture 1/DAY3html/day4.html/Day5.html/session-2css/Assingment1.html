<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Homework</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .paragraph {
            color: blue;
            font-size: 20px;
        }

        .button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        .box {
            color: purple;
        }

        #main-heading {
            color: red;
        }
    </style>
</head>

<body>

    <!-- ID Selector -->
    <h1 id="main-heading">Welcome to My Website</h1>

    <!-- Class Selector 1 -->
    <p class="paragraph">
        This is my first paragraph using Internal CSS.
    </p>

    <!-- Class Selector 2 -->
    <h2 class="box">
        This heading uses a class selector.
    </h2>

    <!-- Class Selector 3 -->
    <p class="box">
        This is another element using the class selector.
    </p>

    <!-- Inline CSS -->
    <button class="button" style="background-color: orange;">
        Click Me
    </button>

</body>
</html>
