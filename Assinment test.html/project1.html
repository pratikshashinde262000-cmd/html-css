<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AJIO Category Page</title>

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #fff;
            color: #222;
        }

        .navbar {
            width: 100%;
            height: 78px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 1000;

            .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #353434;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .search-box {
            width: 220px;
            height: 38px;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 0 15px;
            outline: none;
        }

        .icon {
            font-size: 22px;
            cursor: pointer;
        }

        .menu-btn {
            display: none;
            font-size: 25px;
            cursor: pointer;
        }

            <body>
                 <header class="navbar">

        <div class="logo">
            AJIO
        </div>

        <nav>
            <ul class="nav-links" id="navLinks">
                <li><a href="#">MEN</a></li>
                <li><a href="#">WOMEN</a></li>
                <li><a href="#">KIDS</a></li>
                <li><a href="#">BEAUTY</a></li>
                <li><a href="#">HOME</a></li>
            </ul>
        </nav>
        
           

        </div>

    </header>
